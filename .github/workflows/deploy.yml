name: Deploy to Firebase
# Publishes https://payzo-f14a3.web.app whenever changes land on main (e.g. a merged pull request).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Load Firebase credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set yet, skipping deploy"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy site and Firestore rules
        if: env.SKIP != '1'
        run: npx -y firebase-tools@13.35.1 deploy --only hosting,firestore:rules --project payzo-f14a3 --non-interactive
